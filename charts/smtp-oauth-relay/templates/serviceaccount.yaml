{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smtp-oauth-relay.serviceAccountName" . }}
  labels:
    {{- include "smtp-oauth-relay.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- if .Values.azureWorkloadIdentity.enabled }}
  {{- $_ := set $annotations "azure.workload.identity/client-id" .Values.azureWorkloadIdentity.clientId }}
  {{- with .Values.azureWorkloadIdentity.tenantId }}
  {{- $_ := set $annotations "azure.workload.identity/tenant-id" . }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
