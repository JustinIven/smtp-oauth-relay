apiVersion: v1
kind: Service
metadata:
  name: {{ include "smtp-oauth-relay.fullname" . }}
  labels:
    {{- include "smtp-oauth-relay.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: smtp
      port: {{ .Values.service.port }}
      targetPort: smtp
      protocol: TCP
      {{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "smtp-oauth-relay.selectorLabels" . | nindent 4 }}
