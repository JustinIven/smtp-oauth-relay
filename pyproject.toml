[project]
name = "smtp-oauth-relay"
version = "1.8.0"
description = "SMTP relay that forwards mail through Microsoft Graph using OAuth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosmtpd>=1.4.6",
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.2",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
src = ["src"]
