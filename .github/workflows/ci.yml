name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: uv lock --check
        run: uv lock --check

      - name: uv sync
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

  helm:
    runs-on: ubuntu-latest
    env:
      CHART: charts/smtp-oauth-relay
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: helm lint
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint ($values)"
            helm lint "$CHART" --strict --values "$values"
            echo "::endgroup::"
          done

      - name: helm template | kubeconform
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::kubeconform ($values)"
            helm template smtp-relay "$CHART" --namespace smtp-relay --values "$values" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
