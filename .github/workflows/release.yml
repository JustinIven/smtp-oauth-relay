name: Release

run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  check-version:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -n1)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $project_version"
            exit 1
          fi
          chart_version="$(sed -nE 's/^version: *"?([^"]*)"?/\1/p' charts/smtp-oauth-relay/Chart.yaml | head -n1)"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "::warning::charts/smtp-oauth-relay/Chart.yaml version $chart_version differs from tag; the published chart uses $tag_version"
          fi

  build-and-push:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/smtp-oauth-relay --version "$version" --app-version "$version" --destination dist

      - name: Push chart
        id: push
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # OCI references must be lowercase
          chart_repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "$REGISTRY_PASSWORD" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm push dist/smtp-oauth-relay-*.tgz "oci://${chart_repo}" 2>&1 | tee push.log
          echo "subject=${chart_repo}/smtp-oauth-relay" >> "$GITHUB_OUTPUT"
          echo "digest=$(sed -nE 's/^Digest: (sha256:[0-9a-f]+).*/\1/p' push.log)" >> "$GITHUB_OUTPUT"

  release:
    needs: [build-and-push, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
